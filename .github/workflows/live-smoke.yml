name: Live Smoke (production)

# Runs the assertion-based Playwright smoke against seatable.one to catch
# regressions on the analytics + coupons + events surfaces.
#
# Triggers:
#   - push to main (after Vercel finishes deploying)
#   - nightly at 06:00 UTC (03:00 São Paulo)
#   - manual via workflow_dispatch

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Exposto no nivel do job porque o contexto `secrets` NAO existe dentro de
    # `if:` — usa-lo la e erro de validacao do workflow, que mata a run antes de
    # criar qualquer job (0s, sem log). Foi o que derrubou 100 de 100 runs deste
    # arquivo. Em `if:` o que se le e `env.`, nao `secrets.`.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # As credenciais do sandbox NAO ficam aqui. Env de job vaza para TODO
      # passo — inclusive `npm ci`, que executa scripts de ~400 dependencias
      # transitivas, e para toda action de terceiro. So o que precisa fazer
      # login recebe o valor; o resto do job ve apenas esta flag de presenca.
      # (Revisao do #137.)
      TEM_SANDBOX: ${{ secrets.SANDBOX_EMAIL != '' && secrets.SANDBOX_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      # Verde aqui nao pode querer dizer "nao rodou nada". Os passos que exigem
      # secret sao PULADOS quando ele falta (aparecem como skipped na UI), e este
      # resumo diz exatamente qual cobertura ficou de fora.
      - name: Cobertura desta run
        run: |
          {
            echo "### Cobertura do live-smoke"
            echo ""
            if [ -z "$SUPABASE_URL" ]; then
              echo "- :warning: **migrations + WAHA pulados** — falta \`SUPABASE_URL\` / \`SUPABASE_SERVICE_ROLE_KEY\`"
            else
              echo "- :white_check_mark: migrations + WAHA ativos"
            fi
            if [ -z "$CRON_SECRET" ]; then
              echo "- :warning: **saude dos crons pulada** — falta \`CRON_SECRET\`"
            else
              echo "- :white_check_mark: saude dos crons ativa"
            fi
            # As DUAS, nao so o email: com uma so, o gate abaixo encerra a run
            # e este resumo estaria anunciando cobertura que nao aconteceu.
            if [ "$TEM_SANDBOX" != "true" ]; then
              echo "- :warning: **smoke contra producao pulado** — falta \`SANDBOX_EMAIL\` e/ou \`SANDBOX_PASSWORD\`"
            else
              echo "- :white_check_mark: smoke contra producao ativo"
            fi
            echo ""
            echo "Auditorias estaticas nao precisam de secret e rodam sempre."
            echo "O smoke contra producao PRECISA de \`SANDBOX_EMAIL\` + \`SANDBOX_PASSWORD\`:"
            echo "os specs fazem login. Sem elas a run para antes do smoke, de proposito."
            echo "Cadastrar os secrets em Settings > Secrets and variables > Actions liga o resto."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Fast static check — fails the workflow if a new fire-and-forget
      # Promise is added to an api/ handler that returns a response.
      # Catches the Lambda-shutdown race that bit us 7 times in one week
      # (RELATORIO PDF, registry insert, booking emails, manager-AI fact
      # extraction, voice-call memory extraction, etc.). Allow-list lives
      # in scripts/audit-fire-and-forget.js.
      - name: Audit fire-and-forget promises
        run: npm run audit:fire-and-forget

      # Phantom columns — Title-Case → snake_case migration left several
      # callers querying columns that don't exist (reservations.guest_name,
      # service_records.table_id, customer_ltv.phone). Manager AI received
      # an empty snapshot for weeks because of one such drift. Caught
      # 2026-04-28 in api/services/restaurantSnapshot.js + guest-profile.js
      # + pos/reservations.js. Static scan keeps them fixed.
      - name: Audit phantom column references
        run: npm run audit:phantom-columns

      # Drift check — every CREATE TABLE in supabase/migrations/ must exist
      # in prod. Caught whatsapp_test_messages + voice_experiments missing
      # on 2026-04-26: migrations in repo but never applied → cooldown
      # protection silently disabled, voice-experiments endpoint silently
      # broken. Fix by applying the migration in Supabase Studio.
      - name: Audit migrations applied
        if: env.SUPABASE_URL != ''
        run: npm run audit:migrations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # WAHA pipeline health — fails if 24h shows sig_invalid traffic with
      # zero successful events. Caught the 2026-04-24 key drift on
      # 2026-04-27: 660 silent rejections accumulated while real customer
      # messages dropped. Fix: rotate WAHA_API_KEY on both Vercel + Fly.io
      # to match.
      - name: Audit WAHA pipeline health
        if: env.SUPABASE_URL != ''
        run: npm run audit:waha
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Cron endpoint health — probes every cron in vercel.json with the
      # CRON_SECRET. Catches handlers that are silently broken between
      # schedule runs (file moved, env var missing, db query crashes,
      # function timeout). 2026-04-28: caught compile-wiki timing out
      # at 60s default — bumped its maxDuration to 300s.
      - name: Audit cron endpoint health
        if: env.CRON_SECRET != ''
        run: npm run audit:crons
        env:
          PW_BASE_URL: https://seatable.one
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Sem as credenciais do sandbox, todo spec que faz login morre no login —
      # e morre caro: 4 min parado no head-start delay, download do Chromium,
      # 7 testes com 2 retries cada, gravando video e trace de cada tentativa.
      # Cinco minutos de runner para reaprender o que ja se sabia no segundo 0.
      #
      # Falha, e nao pula, de proposito: pular pintaria de VERDE uma run que nao
      # verificou producao nenhuma — o modo de falha que o passo "Cobertura desta
      # run" existe para evitar. Vermelho honesto e o ponto.
      - name: Exigir credenciais do sandbox
        if: env.TEM_SANDBOX != 'true'
        run: |
          {
            echo ""
            echo "### :x: O smoke contra producao NAO rodou"
            echo ""
            echo "Faltam \`SANDBOX_EMAIL\` e/ou \`SANDBOX_PASSWORD\`. Todo spec deste"
            echo "job faz login, entao sem elas nada de producao e verificado."
            echo ""
            echo "Cadastre em **Settings > Secrets and variables > Actions**."
            echo ""
            echo "As auditorias estaticas acima rodaram e valem — o que falta e o smoke."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Credenciais do sandbox ausentes::Cadastre SANDBOX_EMAIL e SANDBOX_PASSWORD em Settings > Secrets and variables > Actions. Sem elas nenhum spec contra producao roda."
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The smoke tests prod health, not this specific commit's deploy
      # status. Give Vercel a 4 min head-start on push so the odds of
      # testing a stale build are low, then proceed regardless. Skipped
      # for schedule + manual triggers (prod is already live).
      - name: Head-start delay (push only)
        if: github.event_name == 'push'
        run: sleep 240

      - name: Run live smoke spec
        run: npm run test:e2e:live
        env:
          PW_BASE_URL: https://seatable.one
          SANDBOX_EMAIL: ${{ secrets.SANDBOX_EMAIL }}
          SANDBOX_PASSWORD: ${{ secrets.SANDBOX_PASSWORD }}

      # Slow 3G dashboard smoke — confirms skeleton loaders fire and content
      # renders without white-screen / infinite spinner under throttling.
      - name: Slow 3G dashboard smoke
        run: node scripts/test-slow-network.js
        env:
          PW_BASE_URL: https://seatable.one
          SANDBOX_EMAIL: ${{ secrets.SANDBOX_EMAIL }}
          SANDBOX_PASSWORD: ${{ secrets.SANDBOX_PASSWORD }}

      # Admin pages + LTV + AddReservationModal + EditReservationModal smoke
      # Requires sandbox credentials (secrets.SANDBOX_EMAIL/SANDBOX_PASSWORD).
      # 2026-04-29: caught customer detail 500 (churn_risk/ltv_score phantom columns).
      - name: Admin pages smoke
        if: env.TEM_SANDBOX == 'true'
        run: node scripts/test-admin-pages.js
        env:
          SANDBOX_EMAIL: ${{ secrets.SANDBOX_EMAIL }}
          SANDBOX_PASSWORD: ${{ secrets.SANDBOX_PASSWORD }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: live-smoke-screenshots
          path: audit-screenshots/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
