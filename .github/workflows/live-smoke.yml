name: Live Smoke (production)

# Runs the assertion-based Playwright smoke against seatable.one to catch
# regressions on the analytics + coupons + events surfaces.
#
# Triggers:
#   - push to main (after Vercel finishes deploying)
#   - nightly at 06:00 UTC (03:00 São Paulo)
#   - manual via workflow_dispatch

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # On push, wait until Vercel marks the deploy as succeeded before
      # hitting the URL. Skip the wait for schedule + manual triggers —
      # they test whatever is already live.
      - name: Wait for Vercel deploy (push only)
        if: github.event_name == 'push'
        run: |
          SHA="${{ github.sha }}"
          echo "Waiting for Vercel deploy of $SHA..."
          for i in $(seq 1 40); do
            STATE=$(curl -s "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/status" | jq -r '.state')
            echo "attempt $i: $STATE"
            if [ "$STATE" = "success" ]; then
              echo "Deploy complete. Giving edge cache 20s to warm up."
              sleep 20
              exit 0
            fi
            if [ "$STATE" = "failure" ]; then
              echo "Deploy failed — skipping smoke."
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for deploy."
          exit 1

      - name: Run live smoke spec
        run: npm run test:e2e:live
        env:
          PW_BASE_URL: https://seatable.one

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-screenshots
          path: audit-screenshots/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
