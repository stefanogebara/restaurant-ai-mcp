<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seatable - 404 Page Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #FAFAF9; color: #1C1917; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }

  /* -- NAV -- */
  nav { display: flex; align-items: center; justify-content: space-between; padding: 24px 64px; border-bottom: 1px solid #E7E5E4; }
  .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
  .logo span { color: #9F1239; }

  /* -- 404 CONTENT -- */
  .not-found { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px; text-align: center; }

  .not-found-num { font-family: 'Playfair Display', serif; font-size: 180px; font-weight: 500; line-height: 1; letter-spacing: -8px; color: #E7E5E4; margin-bottom: 16px; position: relative; }
  .not-found-num::after { content: ''; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; background: #9F1239; border-radius: 100px; }

  .not-found h1 { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 500; letter-spacing: -0.5px; margin-bottom: 12px; }

  .not-found p { font-size: 16px; color: #78716C; font-weight: 300; margin-bottom: 40px; max-width: 400px; line-height: 1.6; }

  .not-found-actions { display: flex; gap: 12px; }
  .btn-primary { font-size: 15px; font-weight: 600; color: #fff; background: #9F1239; padding: 14px 32px; border-radius: 100px; text-decoration: none; border: none; cursor: pointer; font-family: inherit; }
  .btn-secondary { font-size: 15px; font-weight: 500; color: #57534E; background: transparent; padding: 14px 32px; border-radius: 100px; text-decoration: none; border: 1px solid #D6D3D1; font-family: inherit; cursor: pointer; }

  /* -- FOOTER -- */
  footer { padding: 24px 64px; border-top: 1px solid #E7E5E4; text-align: center; }
  footer p { font-size: 13px; color: #A8A29E; }
</style>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>

<!-- Nav -->
<nav>
  <div class="logo">seatable<span>.</span></div>
</nav>

<!-- 404 -->
<div class="not-found">
  <div class="not-found-num">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
  <div class="not-found-actions">
    <a href="#" class="btn-primary">Go Home</a>
    <button class="btn-secondary" onclick="history.back()">Go Back</button>
  </div>
</div>

<!-- Footer -->
<footer>
  <p>&copy; 2026 Seatable. All rights reserved.</p>
</footer>

</body>
</html>
